name: Deploy to VM

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/332264924975/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@milan-500008.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via IAP tunnel
        run: |
          gcloud compute ssh np7218468_gmail_com@milan-prod \
            --zone=us-central1-f \
            --tunnel-through-iap \
            --command="cd ~/milan-app && git pull origin main && npm install && pm2 restart milan"
