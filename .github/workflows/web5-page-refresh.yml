name: Apply Web5 page standard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-web5-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Web5 content layer
        run: node scripts/apply-web5-pages.js

      - name: Commit generated page updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/*.html frontend/city/*.html frontend/milan-web5-page.css
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "feat: align pages with Milan Web5 ecosystem"
          git push origin HEAD:main
