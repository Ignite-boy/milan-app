<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Milan Chat</title>
  <link rel="stylesheet" href="/milan-core.css">
  <link rel="stylesheet" href="/milan-ui.css">
  <link rel="stylesheet" href="/premium.css">
  <style>
    :root{--bg:#071126;--panel:rgba(18,34,72,.9);--line:rgba(255,255,255,.09);--text:#f7f8ff;--muted:#94a3c7;--orange:#ff9c38;--pink:#df46c8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0%,rgba(94,92,255,.16),transparent 28%),radial-gradient(circle at 90% 8%,rgba(223,70,200,.12),transparent 26%),linear-gradient(180deg,#071126 0%,#0a1430 45%,#090f22 100%)}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(720px,100%);padding:42px 34px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,rgba(18,34,72,.92),rgba(8,19,45,.94));box-shadow:0 24px 70px rgba(0,0,0,.28);text-align:center}
    .logo{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,var(--orange),var(--pink));box-shadow:0 14px 32px rgba(223,70,200,.2)}
    h1{margin:0;font-size:clamp(30px,5vw,46px);letter-spacing:-.03em}
    p{margin:12px auto 26px;max-width:560px;color:var(--muted);line-height:1.6}
    a{display:inline-block;padding:13px 22px;border-radius:14px;background:linear-gradient(135deg,var(--orange),var(--pink));color:#101323;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="logo">💬</div>
      <h1>Milan Chat</h1>
      <p>The Chat page is now connected to Milan. The private one-to-one messaging interface will be built here next.</p>
      <a href="/app.html">Back to Milan</a>
    </section>
  </main>
</body>
</html>
