name: Milan Fast DP Upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fast-dp-upload.yml'

permissions:
  contents: write

jobs:
  optimize-dp-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace DP upload handler
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("frontend/assets/js/app-page-actions.js")
          text = path.read_text(encoding="utf-8")

          replacement = '''  async function handleUpload(event) {
    const input = event.currentTarget;
    const file = input?.files?.[0];

    if (!file || !file.type.startsWith("image/")) {
      if (input) input.value = "";
      return;
    }

    const token = getToken();

    if (!token) {
      alert("Please login again before changing your profile picture.");
      input.value = "";
      return;
    }

    let previewUrl = "";

    try {
      // Show the selected DP immediately.
      previewUrl = URL.createObjectURL(file);

      ["myAvatar", "composerAvatar"].forEach(id => {
        setAvatar(id, previewUrl);
      });

      const preview = $("editProfilePhotoPreview");
      if (preview) {
        preview.src = previewUrl;
        preview.style.display = "block";
      }

      // Compress before upload to keep the request fast.
      const optimized = await compressProfileImage(file);

      // One network write only. No extra verification GET.
      const response = await fetch("/api/profile", {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token
        },
        body: JSON.stringify({
          avatar: optimized.dataUrl
        })
      });

      const saved = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          saved.detail ||
          saved.error ||
          `Profile save failed: ${response.status}`
        );
      }

      const savedProfile =
        saved?.profile ||
        saved?.data?.profile ||
        saved;

      const savedAvatar =
        savedProfile?.avatar ||
        saved?.avatar ||
        optimized.dataUrl;

      if (!savedAvatar) {
        throw new Error("Profile picture was not returned by server.");
      }

      // Persist the saved DP locally for fast restore.
      try {
        localStorage.setItem("milanAvatar", savedAvatar);
      } catch {}

      // Show the final saved DP.
      ["myAvatar", "composerAvatar"].forEach(id => {
        setAvatar(id, savedAvatar);
      });

      if (window.me) {
        window.me.profile = {
          ...(window.me.profile || {}),
          ...(savedProfile || {}),
          avatar: savedAvatar
        };
      }

      if (preview) {
        preview.src = "";
        preview.style.display = "none";
      }
    } catch (error) {
      console.error("[MILAN] DP upload failed:", error);
      restoreAvatar();
      alert("Profile picture could not be saved.");
    } finally {
      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
      }
      input.value = "";
    }
  }
'''

          pattern = re.compile(
              r'  async function handleUpload\(event\) \{.*?\n  \}\n\n  function restoreAvatar\(\)',
              re.S,
          )

          new_text, count = pattern.subn(replacement + "\n  function restoreAvatar(", text, count=1)
          if count != 1:
              raise SystemExit("DP upload handler not found; no changes made.")

          path.write_text(new_text, encoding="utf-8")

      - name: Validate JavaScript structure
        shell: bash
        run: |
          grep -n "async function handleUpload" frontend/assets/js/app-page-actions.js
          grep -n "verifiedResponse" frontend/assets/js/app-page-actions.js && exit 1 || true
          grep -n "One network write only" frontend/assets/js/app-page-actions.js

      - name: Commit DP optimization and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/assets/js/app-page-actions.js .github/workflows/fast-dp-upload.yml
          git commit -m "fix: make profile DP upload faster"
          git push
