<style>
.milan-profile-dialog{
  width:min(720px,94vw);
  max-width:720px;
  padding:0;
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  background:linear-gradient(180deg,#111a2d 0%,#090e18 100%);
  color:#fff;
  box-shadow:0 40px 120px rgba(0,0,0,.65);
  overflow:hidden;
}

.milan-profile-dialog::backdrop{
  background:rgba(2,6,23,.75);
  backdrop-filter:blur(10px);
}

.milan-profile-card{
  margin:0;
  padding:0;
}

.milan-profile-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:24px 26px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:linear-gradient(135deg,rgba(109,93,252,.18),rgba(45,124,255,.08));
}

.milan-profile-head h2{
  margin:0;
  font-size:24px;
}

.milan-profile-head p{
  margin:5px 0 0;
  color:#91a0b8;
  font-size:12px;
}

.milan-profile-close{
  width:40px;
  height:40px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  background:rgba(255,255,255,.05);
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

.milan-profile-body{
  display:grid;
  gap:14px;
  max-height:65vh;
  overflow:auto;
  padding:24px 26px;
}

.milan-field{
  display:grid;
  gap:7px;
  color:#e7edf7;
  font-size:12px;
  font-weight:800;
}

.milan-input{
  width:100%;
  padding:12px 13px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  background:rgba(255,255,255,.035);
  color:#fff;
  outline:none;
}

.milan-input:focus{
  border-color:#6d5dfc;
  box-shadow:0 0 0 3px rgba(109,93,252,.14);
}

.milan-textarea{
  min-height:110px;
  resize:vertical;
}

.milan-field-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.milan-profile-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding:18px 26px 22px;
  border-top:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.02);
}

.milan-profile-cancel,
.milan-profile-save{
  padding:11px 18px;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}

.milan-profile-cancel{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);
  color:#fff;
}

.milan-profile-save{
  border:0;
  background:linear-gradient(135deg,#6d5dfc,#2d7cff);
  color:#fff;
  box-shadow:0 10px 25px rgba(45,124,255,.2);
}

@media(max-width:600px){
  .milan-profile-dialog{width:96vw;border-radius:22px}
  .milan-profile-head,
  .milan-profile-body,
  .milan-profile-actions{padding-left:18px;padding-right:18px}
  .milan-field-grid{grid-template-columns:1fr}
}
</style>

  editProfileBtn?.addEventListener("click", () => {

<script id="editProfileScript">
(function(){
  const btn = document.getElementById("editProfileBtn");
  const dialog = document.getElementById("editProfileDialog");
  const saveBtn = document.getElementById("saveEditProfile");
  const cancelBtn = document.getElementById("cancelEditProfile");
  const photoInput = document.getElementById("editProfilePhoto");
  const photoPreview = document.getElementById("editProfilePhotoPreview");
  const bioInput = document.getElementById("editBio");
  const websiteInput = document.getElementById("editWebsite");

  function getToken(){
    return localStorage.getItem("milan_token") || "";
  }

  function avatarMarkup(avatar, name){
    const fallback = (name || "M").trim().charAt(0).toUpperCase() || "M";

    if (
      avatar &&
      (/^data:image\//.test(avatar) || /^https?:\/\//.test(avatar))
    ) {
      return '<img src="' + avatar.replace(/"/g, '&quot;') + '" alt="Profile">';
    }

    return fallback;
  }

  async function loadProfileIntoDialog(){
    const token = getToken();
    if (!token) return;

    try {
      const response = await fetch("/api/profile", {
        headers: {
          "Authorization": "Bearer " + token
        }
      });

      if (!response.ok) return;

      const profile = await response.json();

      bioInput.value = profile.bio || "";
      websiteInput.value = profile.website || "";

      if (profile.avatar) {
        photoPreview.src = profile.avatar;
        photoPreview.style.display = "block";
      } else {
        photoPreview.src = "";
        photoPreview.style.display = "none";
      }
    } catch (error) {
      console.error("Profile load failed:", error);
    }
  }

  btn?.addEventListener("click", async function(){
    await loadProfileIntoDialog();
    dialog.showModal();
  });

  cancelBtn?.addEventListener("click", function(){
    dialog.close();
  });

  photoInput?.addEventListener("change", function(){
    const file = this.files?.[0];
    if (!file || !file.type.startsWith("image/")) { this.value = ""; return; }
    const reader = new FileReader();
    reader.onload = function(e){
      const avatarEl = document.getElementById("myAvatar");
      const preview = document.getElementById("editProfilePhotoPreview");
      if (preview) preview.src = e.target.result;
      if (avatarEl) { avatarEl.textContent = ""; avatarEl.style.backgroundImage = "url(\"" + e.target.result + "\")"; avatarEl.style.backgroundSize = "cover"; avatarEl.style.backgroundPosition = "center"; avatarEl.style.backgroundRepeat = "no-repeat"; }
    };
    reader.readAsDataURL(file);
  });

  saveBtn?.addEventListener("click", async function(){
    const token = getToken();
    if (!token) return;

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    try {
      let avatar = "";

      const currentAvatar = document.getElementById("editProfilePhotoPreview");
      if (currentAvatar && currentAvatar.src) {
        avatar = currentAvatar.src;
      }

      const selectedFile = photoInput?.files?.[0];

      if (selectedFile) {
        if (selectedFile.size > 900000) {
          throw new Error("Use a profile picture under 900 KB.");
        }

        avatar = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(selectedFile);
        });
      }

      const response = await fetch("/api/profile", {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
          bio: bioInput.value.trim(),
          website: websiteInput.value.trim(),
          avatar: avatar
        })
      });

      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(error.error || "Profile update failed");
      }

      const profile = await response.json();
      const name =
        document.getElementById("myName")?.textContent?.trim() ||
        "Milan User";

      const avatarEl = document.getElementById("myAvatar");
      const composerAvatar = document.getElementById("composerAvatar");

      if (avatarEl && profile.avatar) {
        avatarEl.textContent = "";
        avatarEl.style.backgroundImage = 'url("' + profile.avatar + '")';
        avatarEl.style.backgroundSize = "cover";
        avatarEl.style.backgroundPosition = "center";
        avatarEl.style.backgroundRepeat = "no-repeat";
      }

      if (composerAvatar && profile.avatar) {
        composerAvatar.textContent = "";
        composerAvatar.style.backgroundImage = 'url("' + profile.avatar + '")';
        composerAvatar.style.backgroundSize = "cover";
        composerAvatar.style.backgroundPosition = "center";
        composerAvatar.style.backgroundRepeat = "no-repeat";
      }

      const myBio = document.getElementById("myBio");
      if (myBio) {
        myBio.textContent = profile.bio || "";
      }

      dialog.close();

    } catch (error) {
      alert(error.message || "Profile update failed");
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save Changes";
    }
  });
})();
</script>

<script>
(async function(){
  try {
    const token = localStorage.getItem("milan_token");
    if (!token) return;

    const response = await fetch("/api/profile", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    if (!response.ok) return;

    const profile = await response.json();

    const name =
      profile.display_name ||
      "Milan User";

    const nameEl = document.getElementById("myName");
    const profileNameEl = document.getElementById("profileDialogName");
    const composerAvatar = document.getElementById("composerAvatar");

    if (nameEl) nameEl.textContent = name;
    if (profileNameEl) profileNameEl.textContent = name;

    const initial = name.trim().charAt(0).toUpperCase();

    const avatarEl = document.getElementById("myAvatar");

    if (avatarEl) {
      if (profile.avatar) {
        avatarEl.textContent = "";
        avatarEl.style.backgroundImage = 'url("' + profile.avatar + '")';
        avatarEl.style.backgroundSize = "cover";
        avatarEl.style.backgroundPosition = "center";
        avatarEl.style.backgroundRepeat = "no-repeat";
      } else {
        avatarEl.style.backgroundImage = "";
        avatarEl.textContent = initial;
      }
    }

    if (composerAvatar) {
      if (profile.avatar) {
        composerAvatar.textContent = "";
        composerAvatar.style.backgroundImage = 'url("' + profile.avatar + '")';
        composerAvatar.style.backgroundSize = "cover";
        composerAvatar.style.backgroundPosition = "center";
        composerAvatar.style.backgroundRepeat = "no-repeat";
      } else {
        composerAvatar.style.backgroundImage = "";
        composerAvatar.textContent = initial;
      }
    }

  } catch (error) {
    console.error("Profile load failed:", error);
  }
})();
</script>
