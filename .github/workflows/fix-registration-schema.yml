name: Repair registration schema

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-registration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair optional DWN columns in registration
        shell: python
        run: |
          from pathlib import Path

          p = Path('backend/routes/auth.js')
          s = p.read_text()
          old = """  const { error: insertError } = await supabaseDb.from('users').insert({ id, email, password_hash: passwordHash, name: displayName, did, space_id: spaceId, did_real: identityReal });\n"""
          new = """  // Core account registration must not depend on optional DWN metadata columns.\n  // Supabase account creation is authoritative; DWN metadata is best-effort.\n  const { error: insertError } = await supabaseDb.from('users').insert({\n    id,\n    email,\n    password_hash: passwordHash,\n    name: displayName,\n    did\n  });\n"""
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print('Registration insert repaired.')
          elif 'password_hash: passwordHash, name: displayName, did, space_id: spaceId, did_real: identityReal' in s:
              raise SystemExit('Registration schema still needs a different formatting patch.')
          else:
              print('Registration insert already repaired; no change needed.')

      - name: Syntax check
        run: node --check backend/routes/auth.js

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- backend/routes/auth.js; then
            echo "No registration change needed."
            exit 0
          fi
          git add backend/routes/auth.js
          git commit -m "fix: make registration independent of optional DWN columns"
          git push
