<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- MILAN premium icon — indigo→violet gradient, geometric M -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square base -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- Soft top shine for a premium glassy feel -->
  <rect width="512" height="512" rx="115" fill="url(#shine)"/>
  <!-- Subtle inner border -->
  <rect x="7" y="7" width="498" height="498" rx="109" fill="none"
        stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>

  <!-- Geometric M (drawn as a path — no font dependency) -->
  <path d="M 148 366 L 148 158 L 256 288 L 364 158 L 364 366"
        fill="none" stroke="#0b0b18" stroke-opacity="0.25" stroke-width="58"
        stroke-linecap="round" stroke-linejoin="round"
        transform="translate(0 8)"/>
  <path d="M 148 366 L 148 158 L 256 288 L 364 158 L 364 366"
        fill="none" stroke="#ffffff" stroke-width="58"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
