<style id="milan-fixed-layout">
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body { background: #0a0e1a; color: #e8edf5; font-family: Inter, system-ui, -apple-system, sans-serif; line-height:1.5; }
 .app { min-height:100vh; display:flex; flex-direction:column; }
 .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 20px; background: rgba(15,23,42,0.9); backdrop-filter: blur(12px); border-bottom:1px solid #1e293b; position:sticky; top:0; z-index:100; flex-wrap: nowrap!important; }
 .brand{display:flex; align-items:center; gap:12px; flex-shrink:0}
 .brand-logo img{display:block}
 .brand-text strong{font-size:18px; line-height:1.1; display:block}
 .brand-text span{font-size:12px; color:#94a3b8; display:block; white-space:nowrap!important;}
 .search{flex:1 1 auto; max-width:480px; min-width:200px;}
 .search input{width:100%; background:#111827; border:1px solid #1e293b; color:#e8edf5; padding:10px 16px; border-radius:999px; outline:none;}
 .top-actions{display:flex; gap:8px; flex-shrink:0; align-items:center;}
 .icon-btn{width:38px; height:38px; border-radius:50%; background:#1e293b; border:1px solid #2a3a5a; color:#e8edf5; cursor:pointer; display:grid; place-items:center; font-size:16px;}
 .layout { display:grid; grid-template-columns: 300px minmax(0, 1fr) 340px; gap:20px; width:100%; max-width:1440px; margin:0 auto; padding:20px; align-items:start; }
 .layout > section { min-width:0; }
 .card { background: #111827; border:1px solid #1e293b; border-radius:16px; padding:16px; margin-bottom:0; }
 .sidebar{position:sticky; top:78px; height:fit-content; display:flex; flex-direction:column; gap:16px;}
 .profile{text-align:center}
 .profile h2{margin:12px 0 4px; font-size:18px}
 .profile p{margin:0; color:#94a3b8; font-size:13px}
 .profile-stats{display:flex; justify-content:space-around; margin-top:16px; padding-top:16px; border-top:1px solid #1e293b;}
 .profile-stat b{display:block; font-size:16px}.profile-stat span{font-size:11px; color:#94a3b8; text-transform:uppercase}
 .nav{display:flex; flex-direction:column; gap:6px}
 .nav button{width:100%; text-align:left; background:transparent; border:none; color:#94a3b8; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:14px;}
 .nav button.active,.nav button:hover{background:#1e293b; color:#e8edf5}
 .nav button.accent{background: linear-gradient(135deg, #6366f1, #8b5cf6); color:white; margin-top:8px}
 .composer-row{display:flex; gap:12px; align-items:flex-start;}
 .composer textarea{flex:1; width:100%!important; min-height:56px; resize:none; background:#0a0e1a; border:1px solid #1e293b; border-radius:12px; color:#e8edf5; padding:12px 14px; outline:none; font-family:inherit;}
 .composer-bottom{display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:12px; border-top:1px solid #1e293b;}
 .composer-tools{display:flex; gap:8px}
 .tool{width:32px; height:32px; border-radius:8px; background:#1e293b; border:none; cursor:pointer}
 .publish{background:#6366f1; color:white; border:none; padding:8px 18px; border-radius:999px; font-weight:600; cursor:pointer}
 .rightbar{display:flex; flex-direction:column; gap:20px; position:sticky; top:78px; height:fit-content}
 .right-card h3{margin:0 0 14px; font-size:14px; letter-spacing:0.5px; text-transform:uppercase; color:#94a3b8}
 .person{display:flex; align-items:center; gap:10px; flex-wrap:nowrap; margin-bottom:14px}
 .person:last-child{margin-bottom:0}
 .person-avatar{width:40px; height:40px; border-radius:50%; background:#2a3a5a; display:grid; place-items:center; flex-shrink:0; font-weight:600;}
 .person-info{flex:1; min-width:0; overflow:hidden}
 .person-info b,.person-info span{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.2}
 .person-info b{font-size:14px}.person-info span{font-size:12px; color:#94a3b8}
 .follow{margin-left:auto; background:#1e293b; border:1px solid #2a3a5a; color:#e8edf5; padding:6px 14px; border-radius:999px; font-size:12px; cursor:pointer; flex-shrink:0}
 .avatar,.mini-avatar,.person-avatar, #myAvatar, #composerAvatar {background-size: cover!important; background-position: center!important; background-repeat: no-repeat!important; border-radius: 50%; flex-shrink: 0; overflow:hidden;}
 .avatar,.mini-avatar,.person-avatar{width:48px; height:48px}
 #myAvatar{width:72px; height:72px; margin:0 auto; display:grid; place-items:center; font-size:24px; background:#2a3a5a}
 #composerAvatar{width:42px; height:42px; display:grid; place-items:center; background:#2a3a5a}
 .milan-avatar-upload{position:relative; display:inline-block; cursor:pointer}
 .milan-avatar-upload-icon{position:absolute; bottom:0; right:0; background:#6366f1; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; border:2px solid #111827}
 .mobile-nav { display: none; }
 @media (max-width: 1100px) { .layout{grid-template-columns: 280px 1fr; } .rightbar{display:none} }
 @media (max-width: 768px) { .layout{grid-template-columns:1fr; padding:12px; margin-bottom:70px} .sidebar,.rightbar{position:static} .topbar{flex-wrap:wrap!important} .search{order:3; flex-basis:100%; max-width:100%} .mobile-nav { display: flex; justify-content: space-around; background: #111827; border-top:1px solid #1e293b; padding:8px 0; position: fixed; bottom: 0; left: 0; right: 0; z-index:200 } .mobile-nav a{color:#94a3b8; text-decoration:none; text-align:center; font-size:11px} .mobile-nav a.active{color:#6366f1} }
</style>

<script>
(function() {
    function initUpload() {
        const photoInput = document.getElementById("editProfilePhoto");
        if (!photoInput) return;
        photoInput.removeEventListener("change", handleUpload);
        photoInput.addEventListener("change", handleUpload);
    }
    async function handleUpload(e) {
        const file = this.files?.[0];

        if (!file || !file.type.startsWith("image/")) {
            this.value = "";
            return;
        }

        const token = localStorage.getItem("milan_token") || "";

        if (!token) {
            console.error("[MILAN] DP upload aborted: no milan_token");
            alert("Please login again before changing your profile picture.");
            return;
        }

        try {
            const dataUrl = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error("Could not read image"));
                reader.readAsDataURL(file);
            });

            const img = await new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = () => reject(new Error("Could not decode image"));
                image.src = dataUrl;
            });

            const maxSide = 640;
            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const width = Math.max(1, Math.round(img.width * scale));
            const height = Math.max(1, Math.round(img.height * scale));

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            if (!ctx) throw new Error("Canvas is unavailable");

            ctx.drawImage(img, 0, 0, width, height);

            const blobFromCanvas = quality => new Promise((resolve, reject) => {
                canvas.toBlob(
                    blob => blob ? resolve(blob) : reject(new Error("Image compression failed")),
                    "image/jpeg",
                    quality
                );
            });

            let blob = await blobFromCanvas(0.82);

            for (let quality = 0.76; blob.size > 820000 && quality >= 0.45; quality -= 0.08) {
                blob = await blobFromCanvas(quality);
            }

            if (blob.size > 820000) {
                throw new Error("Image is still too large after compression.");
            }

            const optimizedDataUrl = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error("Could not encode image"));
                reader.readAsDataURL(blob);
            });

            console.log("[MILAN] DP optimized:", {
                originalBytes: file.size,
                optimizedBytes: blob.size,
                width,
                height
            });

            const response = await fetch("/api/profile", {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({ avatar: optimizedDataUrl })
            });

            const saved = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(saved.detail || saved.error || ("Profile save failed: " + response.status));
            }

            const verifiedResponse = await fetch("/api/profile", {
                headers: {
                    "Authorization": "Bearer " + token
                },
                cache: "no-store"
            });

            const verified = await verifiedResponse.json().catch(() => ({}));

            if (!verifiedResponse.ok || !verified.avatar) {
                throw new Error(verified.detail || "DP was not verified after DWN save");
            }

            console.log("[MILAN] DP verified from server/DWN");

            if (window.me) {
                window.me.profile = {
                    ...(window.me.profile || {}),
                    ...verified
                };
            }

            localStorage.setItem("milanAvatar", verified.avatar);

            ["myAvatar", "composerAvatar"].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.style.backgroundImage = 'url("' + verified.avatar + '")';
                    el.style.backgroundSize = "cover";
                    el.style.backgroundPosition = "center";
                    el.style.backgroundRepeat = "no-repeat";
                    el.textContent = "";
                }
            });

            const preview = document.getElementById("editProfilePhotoPreview");
            if (preview) {
                preview.src = "";
                preview.style.display = "none";
            }
        } catch (err) {
            console.error("[MILAN] DP save/verify failed:", err);
            alert("Profile picture could not be saved to DWN.");
        } finally {
            this.value = "";
        }
    }

    if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",initUpload); else initUpload();
})();
</script>
<script>
(function() {
    function restoreAvatar() {
        const saved=localStorage.getItem("milanAvatar"); if(!saved) return;
        ["myAvatar","composerAvatar"].forEach(id=>{const el=document.getElementById(id); if(el){el.style.backgroundImage='url("'+saved+'")'; el.style.backgroundSize="cover"; el.style.backgroundPosition="center"; el.style.backgroundRepeat="no-repeat"; el.textContent="";}});
        if(window.me&&window.me.profile){window.me.profile.avatar=saved;}
    }
    restoreAvatar(); document.addEventListener("DOMContentLoaded",restoreAvatar);
})();
</script>

<script>
(function () {
    async function syncLiveProfileIdentity() {
        const token =
            localStorage.getItem("milan_token") ||
            localStorage.getItem("milanToken") ||
            "";

        if (!token) return;

        const headers = {
            "Authorization": "Bearer " + token,
            "Accept": "application/json"
        };

        let me = null;
        let profile = null;

        try {
            const meResponse = await fetch("/api/auth/me", {
                headers,
                cache: "no-store"
            });

            if (meResponse.ok) {
                me = await meResponse.json();
            }
        } catch (err) {
            console.warn("[MILAN] auth/me identity sync failed:", err);
        }

        try {
            const profileResponse = await fetch("/api/profile", {
                headers,
                cache: "no-store"
            });

            if (profileResponse.ok) {
                profile = await profileResponse.json();
            }
        } catch (err) {
            console.warn("[MILAN] profile identity sync failed:", err);
        }

        const user =
            me?.user ||
            me?.data?.user ||
            me ||
            {};

        const meProfile =
            me?.profile ||
            me?.data?.profile ||
            {};

        const profileData =
            profile?.profile ||
            profile ||
            {};

        const name = String(
            profileData.display_name ||
            profileData.name ||
            meProfile.display_name ||
            meProfile.name ||
            user.name ||
            user.display_name ||
            ""
        ).trim();

        const email = String(
            profileData.email ||
            meProfile.email ||
            user.email ||
            ""
        ).trim();

        const nameEl = document.getElementById("myName");
        const emailEl = document.getElementById("myEmail");

        if (nameEl && name) {
            nameEl.textContent = name;
        }

        if (emailEl && email) {
            emailEl.textContent = email;
        }

        if (window.me) {
            window.me = {
                ...window.me,
                ...user,
                profile: {
                    ...(window.me.profile || {}),
                    ...meProfile,
                    ...profileData
                }
            };
        }

        console.log("[MILAN] Live profile identity synced:", {
            name: name || "(empty)",
            email: email || "(empty)"
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", syncLiveProfileIdentity);
    } else {
        syncLiveProfileIdentity();
    }
})();
</script>


<script id="MILAN-UI-ACTIONS-V1">
(function () {
    "use strict";

    // ---------- Navigation ----------
    const go = (url) => {
        window.location.href = url;
    };

    const buttons = Array.from(document.querySelectorAll(".nav button"));

    if (buttons[0]) buttons[0].onclick = () => go("/app?view=home");
    if (buttons[1]) buttons[1].onclick = () => go("/app?view=mine");
    if (buttons[2]) buttons[2].onclick = () => go("/app?view=public");
    if (buttons[3]) buttons[3].onclick = () => go("/app?view=saved");

    const editProfileBtn = document.getElementById("editProfileBtn");
    if (editProfileBtn) {
        editProfileBtn.onclick = () => go("/settings");
    }

    // Privacy
    if (buttons[buttons.length - 2]) {
        buttons[buttons.length - 2].onclick = () => go("/privacy");
    }

    // MILAN AI
    const aiBtn = buttons[buttons.length - 1];
    if (aiBtn) {
        aiBtn.onclick = () => go("/app?view=ai");
    }

    // ---------- Top actions ----------
    const topActions = document.querySelectorAll(".top-actions .icon-btn");

    // logout is already handled elsewhere
    if (topActions[1]) topActions[1].onclick = () => go("/chat");
    if (topActions[2]) topActions[2].onclick = () => go("/music");

    // Theme toggle
    if (topActions[3]) {
        topActions[3].onclick = () => {
            const light = document.documentElement.dataset.milanTheme === "light";

            if (light) {
                delete document.documentElement.dataset.milanTheme;
                localStorage.setItem("milanTheme", "dark");
                document.documentElement.style.colorScheme = "dark";
            } else {
                document.documentElement.dataset.milanTheme = "light";
                localStorage.setItem("milanTheme", "light");
                document.documentElement.style.colorScheme = "light";
            }
        };
    }

    // Notifications
    if (topActions[4]) {
        topActions[4].onclick = () => go("/app?view=notifications");
    }

    // Restore theme preference
    const savedTheme = localStorage.getItem("milanTheme");
    if (savedTheme === "light") {
        document.documentElement.dataset.milanTheme = "light";
        document.documentElement.style.colorScheme = "light";
    }

    // ---------- Composer ----------
    const tools = Array.from(document.querySelectorAll(".composer-tools .tool"));

    // Image
    if (tools[0]) {
        tools[0].onclick = () => {
            let input = document.getElementById("composerImageInput");

            if (!input) {
                input = document.createElement("input");
                input.type = "file";
                input.id = "composerImageInput";
                input.accept = "image/*";
                input.hidden = true;

                input.addEventListener("change", () => {
                    const file = input.files?.[0];
                    if (!file) return;

                    tools[0].dataset.file = file.name;
                    tools[0].title = file.name;
                    tools[0].textContent = "✅";
                });

                document.body.appendChild(input);
            }

            input.click();
        };
    }

    // Attachment
    if (tools[1]) {
        tools[1].onclick = () => {
            let input = document.getElementById("composerFileInput");

            if (!input) {
                input = document.createElement("input");
                input.type = "file";
                input.id = "composerFileInput";
                input.hidden = true;

                input.addEventListener("change", () => {
                    const file = input.files?.[0];
                    if (!file) return;

                    tools[1].dataset.file = file.name;
                    tools[1].title = file.name;
                    tools[1].textContent = "✅";
                });

                document.body.appendChild(input);
            }

            input.click();
        };
    }

    // Emoji
    if (tools[2]) {
        tools[2].onclick = () => {
            const postText = document.getElementById("postText");
            if (!postText) return;

            const emoji = " 😊";
            const start = postText.selectionStart ?? postText.value.length;
            const end = postText.selectionEnd ?? postText.value.length;

            postText.value =
                postText.value.slice(0, start) +
                emoji +
                postText.value.slice(end);

            postText.focus();
            postText.selectionStart = postText.selectionEnd =
                start + emoji.length;
        };
    }

    // Privacy toggle
    if (tools[3]) {
        tools[3].onclick = () => {
            const active = tools[3].dataset.privacy === "private";

            tools[3].dataset.privacy = active ? "public" : "private";
            tools[3].textContent = active ? "🌍" : "🔒";
            tools[3].title = active ? "Public post" : "Private post";
        };
    }

    // ---------- Follow buttons ----------
    document.querySelectorAll(".follow").forEach((btn) => {
        btn.addEventListener("click", () => {
            const person =
                btn.closest(".person")?.querySelector(".person-info b")
                    ?.textContent
                    ?.trim() || "user";

            const following = btn.dataset.following === "true";

            btn.dataset.following = following ? "false" : "true";
            btn.textContent = following ? "Follow" : "Following";
            btn.setAttribute(
                "aria-label",
                following
                    ? `Follow ${person}`
                    : `Unfollow ${person}`
            );

            localStorage.setItem(
                "milan_follow_" + person.toLowerCase().replace(/\s+/g, "_"),
                following ? "false" : "true"
            );
        });
    });

    console.log("[MILAN] All primary UI controls activated.");
})();
</script>
